# Truss-braced-wing (SUGAR-like) reference input with liquid hydrogen (LH2) fuselage tanks: the same truss-braced,
# high-wing airframe as default_tbw.toml (AR 16, FAR 25.337 pull-up load factor), but the fuel is stored cryogenically in a
# fuselage tank behind the cabin instead of in the wing, so the wing carries no fuel. Fuel system inputs (tank, insulation,
# heat exchangers) are taken from cryo_input_H2.toml.
# It is a starting point to be refined by the optimiser. Differences to default_tbw.toml are marked "CRYO:".

# This is a template TOML input file and are the default values that will
# be used by TASOPT
["Aircraft Description"]
    name = "TBW reference aircraft with liquid hydrogen (LH2) fuselage tanks"
    description = """
    Truss-braced, high-wing TBW reference aircraft that stores liquid hydrogen (LH2) in a fuselage tank
    and carries no fuel in the wing. Same airframe as default_tbw.toml.
    """
    aircraft_type   = "Narrow Body Aircraft"     # 0: Regional Aircraft
                                    # 1: Narrow Body Aircraft
                                    # 2: Wide Body Aircraft

#-------------------------------------------------#
##               Note on units                   ##
#-------------------------------------------------#
# TASOPT input files can parse the following units.
#  if no units are provided or pure numerical values are
#  provided then they are assumed to be in SI units.
# ╔══════════╦══════════╦══════════════════════════╗
# ║ Quantity ║ SI units ║ Other allowed units      ║
# ╠══════════╬══════════╬═════╦═══════╦═══════╦════╣
# ║ mass     ║ kg       ║ g   ║ lbm   ║       ║    ║
# ╠══════════╬══════════╬═════╬═══════╬═══════╬════╣
# ║ distance ║ m        ║ km  ║ nmi   ║ ft    ║ in ║
# ╠══════════╬══════════╬═════╬═══════╬═══════╬════╣
# ║ area     ║ m2       ║     ║       ║ ft2   ║ in2║
# ╠══════════╬══════════╬═════╬═══════╬═══════╬════╣
# ║ volume   ║ m3       ║     ║       ║ ft3   ║ in3║
# ╠══════════╬══════════╬═════╬═══════╬═══════╬════╣
# ║ force    ║ N        ║ kN  ║ lbf   ║       ║    ║
# ╠══════════╬══════════╬═════╬═══════╬═══════╬════╣
# ║ pressure ║ Pa       ║ atm ║lbf/in2║lbf/ft2║ psi║    
# ╠══════════╬══════════╬═════╬═══════╬═══════╬════╣
# ║ speed    ║ m/s      ║ kts ║ km/hr ║ ft/s  ║    ║
# ╠══════════╬══════════╬═════╬═══════╬═══════╬════╣
# ║ power    ║ W        ║ kW  ║ MW    ║ hp    ║    ║
# ╠══════════╬══════════╬═════╬═══════╬═══════╬════╣
# ║ angle    ║ rad      ║ deg ║       ║       ║    ║
# ╚══════════╩══════════╩═════╩═══════╩═══════╩════╝

[Options] #
    wing_config = "truss_braced" # TBW: truss-braced wing (strut with a jury strut). Options are "cantilever", "strut_braced" or "truss_braced"
    far_load_factor = true # TBW: FAR/CS 25.337 pull-up load factor (2.5 at this weight class) for the wing sizing, so that the wing is sized for +2.5 g / -1 g as in SUGAR, instead of `load_factor`

    engine_location = "wing" # 1: Engines on "wing"
                             # 2: Engines on "fuselage"

    prop_sys_arch = "TF" #Options are TF: Turbofan
                         #            constant_TSFC: simple engine with constant TSFC
    trefftz_resolution = "COARSE"
    # Trefftz plane discretization quality
    # "COARSE":  ~1.8% error rel. reference,  43 panels (fast, mainly for quick studies)
    # "MEDIUM":  ~0.6% error rel. reference,  84 panels (balanced, recommended default)
    # "FINE":    reference,   328 panels (reference)

    # Optional: Advanced Trefftz plane analysis parameters (usually don't need to change)
    trefftz_k_tip = 16.0            # Tip loading exponent (default: 16.0)
    trefftz_bunch = 0.5             # Panel clustering factor ∈ [0,1] (default: 0.5)
    wing_root_contraction = 0.2  # Root streamline contraction (default: 0.2)
    tail_root_contraction = 1.0  # Root streamline contraction for tail (1.0 -> no real contraction)
    

[Fuel]
    fuel_type       = "LH2" # Choices are "Jet-A", "LH2", "CH4", "C2H6", "C2H4", "C2H5OH"
    fuel_in_wing    = false # CRYO: no fuel in the wing, the fuel is in the fuselage tank
    fuel_in_wingcen = false # CRYO: no fuel in the wing center box
    fuel_usability_factor = 0.90 # fraction of max fuel volume that is usable

    fuel_enthalpy_vaporization = 0.0 #J/kg, latent heat of vaporization of fuel

[Fuel.Storage]
    tank_placement = "both" #Location of tank in fuselage. Choices are "front", "rear", or "both".
    # CRYO: "both" instead of the "rear" of cryo_input_H2.toml. With the whole fuel in a rear tank the weight iteration of
    # this high-wing airframe does not converge (the aft fuel mass drives the horizontal tail size and the sizing
    # leaves the feasible region); with two tanks, fore and aft of the cabin, it converges.

    tank_aspect_ratio = 2.0
    fuselage_clearance = "0.3 ft"
    additional_mass_fraction = 0.25
    weld_efficiency = 0.9 
    ullage_fraction = 0.05 #minimum ullage fraction at tank venting pressure
    heat_leak_factor = 1.3 #Factor to account for heat leakage through structural elements, piping, etc (qfac > 1)

    #Tank pressure design parameters
    pressure_rise_factor = 2.0 #Factor to account for stratification in homogenous tank model (pfac >= 1)
    pressure_venting = "2 atm"
    pressure_initial = "1.2 atm"
    hold_departure = "0 h"
    hold_arrival = "0 h"

    inner_vessel_material = "Al-2219-T87"
    inner_vessel_support_angle = "80 deg"
    
    #Insulation options: "rohacell41S", "polyurethane27", "polyurethane32", "polyurethane35", "vacuum", "mylar", "microspheres"
    sizes_insulation = true #Flag to decide whether to size insulation for boiloff
    insulation_material = ["polyurethane32", "polyurethane32", "polyurethane32"] 
    insulation_segment_base_thickness = [0.05, 0.05, 0.05] #m
    
    cruise_boiloff_rate = 0.4 #%/hour, used if sizes_insulation == true
    insulation_thicknesses_design_indices = [1,2,3] #insulation segments to size if sizes_insulation == true

    #Parameters for double-walled tank, if "vacuum" is in insulation_material
    outer_vessel_material = "Al-2219-T87"
    outer_vessel_support_angles = ["45 deg", "135 deg"]

[Mission]
    N_missions = 2 # Number of missions to be modeled (first mission is the design mission)
                                
    range = ["3000.0 nmi", "2000.0 nmi"] # Design Range + second mission range

    payload = ["180 pax", "150 pax"]     # Mission payload; pax can be used as a unit of weight.
                                        # Weight per pax also specified (215 lbf/pax is std)

    weight_per_pax = "215.0 lbf"    # Specify weight per passenger - 
                                    # includes luggage [lbm or lbf or kg or N] 
                                    # judging you if you use imperial units but wtvs

    exit_limit = 230            # Maximum number of passengers that can sit in the cabin

    max_payload = "230 pax"     # Defines the maximum payload carrying capacity of the aircraft
                                # It is the maximum payload that the aircraft can carry (including cargo),
                                # in an off-design mission

    fuel_reserves = 0.20 # W_reserveFuel / W_fuelburned

    Nlift = 3.0 # Max vertical load factor for wing bending loads
    Vne = "280 kts" # Never exceed IAS for tail loads

[Mission.Takeoff]
    takeoff_alt = ["0.0 ft", "500 ft"] 
    takeoff_T = [288.2, 298.0]

    max_balanced_field_length = "8000.0 ft"
    Nland = 6.0 # Max vertical load factor for fuse bending loads

    CL_max_perp     = 2.25  #CLmax/(cos(sweep))^2
    CD_dead_engine  = 0.50  #CDA_fan/ A_fan
    CD_landing_gear = 0.015 #CD*Agear/ Sref
    CD_spoilers     = 0.10  #CD*Aspoiler/ Sref

    rolling_resistance_coeff = 0.025
    braking_resistance_coeff = 0.35

    takeoff_obstacle_height = "35 ft"

[Mission.Climb]
    minimum_top-of-climb_gradient = 0.015

[Mission.Cruise]
    cruise_alt  = ["35000 ft", "38000 ft"] 
    cruise_mach = 0.80
    cruise_CL   = 0.57 #By default, this gets recalculated for off-design mission analysis
                       # (see `fly_mission!()` and `PayloadRange()` for details, or to recalculate altitude instead).

[Mission.Descent]
    descent_angle_top-of-descent = "-3.0 deg"
    descent_angle_bottom-of-descent = "-3.0 deg"

[Fuselage]
    cabin_pressure_altitude = "8000.0 ft"

[Fuselage.Geometry]
    number_of_bubbles = 1  # SingleBubble or MultiBubble Designs
    radius = "77 in"       # Fuselage radius
    dRadius = "15 in"      # Downward shift of lower bubbles
    y_offset = 0.0         # y offset of bubble center
    floor_depth = "5.0 in" # depth of floor beams
    a_nose = 1.65 # Nose radius = Rfuse*(1 - xi^a_nose)^(1/a_nose)
    b_tail = 2.0 # Tail radius = Rfuse*(1 - xi^b_tail)
    tailcone_taper = 0.3
    tapers_to = "point" # Options are "point" or "edge"
    
    # Tail load fuselage bending moment inertial relief factor
    HT_load_fuse_bend_relief = 0.4 
    VT_load_fuse_bend_relief = 0.7
# Overall fuselage layout
    #Use provided layout (false) or recalculate it (true) for maximum pax keeping deltas
    calculate_cabin_length = false 

    double_decker   = false #if true, the fuselage has two passenger decks
    floor_distance  = "0 in" #Vertical distance between floors if double decker
    min_top_cabin_height  = "2 m" #Minimum height of top cabin, if double decker
    seat_pitch      = "30 in"
    seat_width      = "19 in"
    seat_height     = "45 in"
    aisle_halfwidth = "10 in"
    front_seat_offset = "10 ft" #Distance from front of cabin to first seat
    rear_seat_offset = "5 ft" #Distance from last seat to rear of cabin
    unit_load_device = "LD3" #Cargo container for double decker sizing

    #Provided layout
    x_nose_tip           = "0 ft"
    x_pressure_shell_fwd = "17 ft"
    x_start_cylinder     = "20 ft"
    x_end_cylinder       = "97 ft"
    x_pressure_shell_aft = "102 ft"
    x_cone_end           = "117 ft"
    x_end                = "124 ft"
    
# Power systems and landing gear locations
    x_HPE_sys = "62ft" #Hydraulic, Pneumatic and Electrical systems
    x_APU = "120 ft"

    x_fixed_weight = "7ft" #Cockpit/ pilots etc

# Engine positions
    x_engines = "52 ft"
    y_critical_engines = "16 ft" # y location of engines that would cause max yaw


[Fuselage.Weights]
    stringer = 0.35   # (Weight of stringers)/ Wskin
    frame    = 0.25   # (Weight of frame)/ Wskin
    additional = 0.20 # (Additional weight)/ Wskin

    fixed_weight = "3000 lbf" #cockpit, pilots etc

    # Fuselage reinforcement at the strut attachment, W = weight_frac_strut_attach * R, with R the largest vertical
    # reaction of both struts on the fuselage [N]. CURRENTLY HAS NO EFFECT: this load-based weight is switched off until
    # a derived value exists (0.05 is a PLACEHOLDER). The attachment weight is [Wing.Strut] weight_frac_attachments * strut weight.
    weight_frac_strut_attach = 0.05

    window_per_length     = 435.0 #[N/m]
    window_insul_per_area =  22.0 #[N/m2]
    floor_weight_per_area =  60.0 #[N/m2]

    HPE_sys_weight_fraction = 0.010 # W_HPEsys/WMTO

    APU_weight_fraction = 0.035 # W_APU/W_payload
    seat_weight_fraction = 0.10 # Wseats/W_payload
    add_payload_weight_fraction = 0.35 # Additional payload proportional Wfrac

[Fuselage.Aero]
    calculates_pitching_moment_volume = false  # if true, CMVf1 calculated during size_aircraft!() via slender body theory
                                # if false, value specified by pitching_moment_volume is used
    pitching_moment_volume = "2390.0 ft3" # d(Mfuse/q)/dCL
    CL_zero_fuse_moment      = 0.185         # CL when Mfuse = 0
    #Fuselage velocity overspeed at wing
    wingroot_fuse_overspeed  = 0.018
    wingbreak_fuse_overspeed = 0.014
    wingtip_fuse_overspeed   = 0.0045

    excrescence_drag_factor = 1.03 # Rivets, sheet breaks etc

    BLI_frac = 0.0 #Fraction of fuselage BL KE defect ingested

[Wing]

    sweep = 20.0 # wing sweep in degrees. TBW: low sweep for a high-AR wing
    AR    = 16.0 # TBW: raised aspect ratio enabled by the strut (the TBW reference aircraft uses AR 16)
    maxSpan = "170 ft" # TBW: the AR 16 wing spans about 152 ft, above the 117.5 ft gate limit; 170 ft is the SUGAR Mach 0.80 span (a ground-fold span limit is not modelled)

    inner_panel_taper_ratio = 0.7  #cs/co
    outer_panel_taper_ratio = 0.25 #ct/co

    panel_break_location = 0.6 # eta_s panel break eta location. eta = y/(b/2). TBW: also the strut attachment on the wing
    engine_location = 0.285 # engine eta location. eta = y/(b/2). One engine per wing. TBW: inboard of the strut attachment at the panel break
    
    center_box_halfspan = "71.0 in"
    box_width_to_chord = 0.50 #Spar box width to chord ratio
    root_thickness_to_chord = 0.10 # TBW: thinner wing for the lower sweep
    spanbreak_thickness_to_chord = 0.10

    hweb_to_hbox = 0.75 #web-height/hbox ratio
    spar_box_x_c = 0.40 # spar box axis x/c location

    # min_cap_thickness and min_web_thickness are omitted: the braced defaults of 0.0015 m (cap) and
    # 0.0010 m (web) apply. They are thin placeholders that should be reviewed separately.

    x_wing_box = "57 ft"
    z_wing  = "5.5 ft" # TBW: high wing, box centre near the top of the fuselage (radius 77 in). Positive is above the fuselage axis

    # Airfoil data (Should be stored in src/airfoil_data/)
    airfoil = "C.air"

[Wing.Strut]
    #Only used if `wing_config` is not "cantilever"
    z_fuselage_attach       = "120 in" # TBW: vertical distance from the wing box to the strut fuselage attachment, on the lower fuselage
    y_fuselage_attach       = "0.0 m" # strut y position at the fuselage attachment
    thickness_to_chord      = 0.30 # strut thickness to chord
    local_velocity_ratio    = 1.0 # V_strut/V_freestream
    box_width_to_chord      = 0.5 # strut box width to chord ratio
    web_to_box_height       = 0.75 # strut box web height to box height ratio
    end_fixity_K            = 1.0 # Euler effective-length factor of the strut end fixity
    chord_to_wing_chord     = 0.8 # PLACEHOLDER: strut chord as a fraction of the wing chord at the strut attachment, chosen so that at the default strut-braced geometry the strut + jury share of the wing group weight is near the SUGAR Phase IV value of about 30 %
    min_cap_thickness       = "1.5 mm" # PLACEHOLDER: minimum strut cap thickness (same as the braced wing minimum cap gauge)
    min_web_thickness       = "1.0 mm" # PLACEHOLDER: minimum strut web thickness (same as the braced wing minimum web gauge)
    weight_frac_added       = 0.60 # added weight fraction for fairings and fittings (placeholder)
    cl_ratio                = 0.0 # strut lift model input: strut section cl divided by the mean section cl of the wing (0 = strut carries no lift)
    spanload_exponent       = 0.0 # strut lift model input: exponent p of the strut circulation shape (1-xi^2)^p, xi = 0 at the fuselage end and 1 at the wing end (0.0 = constant) (0.5 = elliptic)

[Wing.Jury]
    # Vertical jury strut. Only used if `wing_config` is "truss_braced"
    # A coarse scan of eta_strut from 0.05 to 0.95 in steps of 0.05 (truss_braced, panel break eta_s = 0.6, 0.7, 0.75) gives the minimum WMTO and PFEI at 0.5 in every case. The optimum is a sharp V because the main-strut buckling length is max(eta_strut, 1-eta_strut) times the strut length, and the jury weight is negligible (0.02-0.1 % of the wing structure), so the jury position is set by that symmetry only.
    eta_strut = 0.5 # position of the jury along the strut as a fraction of the strut length, from the fuselage end
    weight_frac_added = 0.60 # added weight fraction for fairings and fittings of the jury (placeholder - same as for the strut)
    chord_to_strut_chord = 0.5 # PLACEHOLDER: jury strut chord as a fraction of the main strut chord
    min_cap_thickness = "1.5 mm" # PLACEHOLDER: minimum jury strut cap thickness
    min_web_thickness = "1.0 mm" # PLACEHOLDER: minimum jury strut web thickness

[Wing.Aero]
    fuselage_lift_carryover_loss_factor = -0.3
    wing_tip_lift_rolloff_factor        = -0.05

    lowspeed_cdf = 0.0085
    lowspeed_cdp = 0.0035
    Re_ref       = 20e6

    #Only used if strut present. Section drag coefficients of the strut, also used for the jury strut (truss_braced).
    #strut_Re_ref is the Reynolds number (based on strut or jury chord) at which they apply; the drag is Re-scaled with Reynolds_scaling
    strut_lowspeed_cdf = 0.0085
    strut_lowspeed_cdp = 0.0035
    strut_Re_ref       = 1e6

    Reynolds_scaling = -0.15 # = aRe, used for Re-scaling CD = cd*(Re/Re_ref)^aRe

    excrescence_drag_factor = 1.02 # Rivets, sheet breaks etc

    BLI_frac = 0.0 #Fraction of wing BL KE defect ingested

# Spanwise cl and cm distributions:
[Wing.Aero.Takeoff]
    cls_clo = 1.1 #rcls = break/root cl ratio = cls/clo
    clt_clo = 0.6 #rclt = tip  /root cl ratio = clt/clo
    cm_o = -0.20 # root section cm
    cm_s = -0.20 # span-break section cm
    cm_t = -0.02 # tip section cm

[Wing.Aero.Climb] #used for all clean situations
    cls_clo = 1.238 #rcls = break/root cl ratio = cls/clo
    clt_clo = 0.90 #rclt = tip  /root cl ratio = clt/clo
    cm_o = -0.06 # root section cm
    cm_s = -0.06 # span-break section cm
    cm_t = -0.06 # tip section cm

[Wing.Aero.Landing] #Forward-CG tail sizing case
    cls_clo = 1.1 #rcls = break/root cl ratio = cls/clo
    clt_clo = 0.5 #rclt = tip  /root cl ratio = clt/clo
    cm_o = -0.35 # root section cm
    cm_s = -0.35 # span-break section cm
    cm_t = -0.02 # tip section cm

[Wing.Weightfracs]
    # Weight fractions of flight surfaces and secondary wing components
    # as fractions of the sturctural wing box weight
    flap = 0.2 #flaps, flap mounts and actuators weight fraction
    slat = 0.1 #slats, slat mounts and actuators weight fraction
    aileron = 0.04 #ailerons, aileron mounts and actuators weight fraction
    leading_trailing_edge = 0.1
    ribs = 0.15        # Ribs, local stiffeners, reinforcements
    spoilers = 0.020   # Spoilers, spolier mounts and attachements
    attachments = 0.03 # Wing attachment hardware



[Stabilizers]

    #Tail profile drags:
    lowspeed_cdf = 0.0060
    lowspeed_cdp = 0.0035
    Re_ref       = 10e6

    excrescence_drag_factor = 1.02 # Rivets, sheet breaks etc

    [Stabilizers.Htail]
        multi_section = false # True for inner and outer section
        AR_Htail = 6.0
        taper = 0.25
        sweep = 26.0 #typically can be set to be the same as the wings
        center_box_halfspan = "2.5 ft"
        x_Htail = "114.5 ft"
        z_Htail = "0 ft"
        number_Htails = 2.0

        max_tail_download = -0.5 # = CLh/CLmax. Tail download param at max load case.
        
        # How do you want to size the horizontal stabilizers?
        opt_sizing = "fixed_Vh" # Options are "fixed_Vh" or "CLmax_fwdCG" 
        # 1: set Sh via specified Vh
        # 2: set Sh via CLhCGfwd at max-forward CG during landing
        Vh = 1.45 # Horizontal tail volume (only used if opt_sizing == "fixed_Vh")
        CLh_at_max_forward_CG = -0.7 # (only used if opt_sizing == "CLmax_fwdCG")

        opt_move_wing = "min_static_margin" # "fixed": "fix" wing position 
                            # "fixed_CLh": move wing to get CLh="CLhspec" in cruise 
                            # "min_static_margin": move wing to get min static margin = "SMmin"

        SM_min = 0.05 # Minimum static margin
        CLh_spec = -0.02

        downwash_factor = 0.60 #dε/dα
        nacelle_lift_curve_slope = 3.8 #dCL_nacelle/dα
                                       # Recommend ~3.8 for wing mounted nacelle
                                       #           ~0.0 for rear mounted nacelle
        CD_Htail_from_center = 0.1 #CDhtail contribution factor from center part 0 < y < yoh
        CLh_max = 2.0

        added_weight_fraction = 0.30 # e.g. ribs, LE, elevator, attachments

        box_width_to_chord = 0.50
        box_height_chord = 0.14
        web_height_hbox  = 0.75

    [Stabilizers.Vtail]
        AR_Vtail = 2.0
        taper = 0.30
        sweep = 25.0
        center_box_halfspan = 0.0
        x_Vtail = "110 ft"
        number_Vtails = 1.0

        # How do you want to size the vertical stabilizer?
        opt_sizing = "fixed_Vv" # Options are "fixed_Vv" or "OEI"
        # "fixed_Vv": set Vtail area Sv via specified Vv
        # "OEI": set Vtail area Sv via engine-out trim CL "CLv_at_engine_out"
        Vv = 0.1 # only used if opt_sizing == "fixed_Vv"
        CLv_at_engine_out = 0.5 # only used if opt_sizing == "OEI"
        CLv_max = 2.6

        added_weight_fraction = 0.40 # e.g. ribs, LE, rudder, attachments

        box_width_to_chord = 0.50
        box_height_chord = 0.14 
        web_height_hbox  = 0.75

[LandingGear]
    landing_gear_model = "mass_fractions" #Options are "mass_fractions" and "historical_correlations"
    x_nose_landing_gear        = "14ft"
    x_main_landing_gear_offset = "1 ft" # main LG offset behind the rearmost CG position

    #For "mass_fractions" model
    LG_nose_weight_fraction = 0.011 # Wlgnose/WMTO
    LG_main_weight_fraction = 0.044 # Wlgmain/WMTO

    #For "historical_correlations" model
    y_main_landing_gear_halfspan_fraction = 0.2 # eta landing gear location. eta = y/(b/2)
    tailstrike_angle = "10 deg"
    wing_dihedral_angle = "6 deg"
    engine_ground_clearance = "23 in"
    LG_nose_number_struts = 1
    LG_nose_wheels_per_strut = 2
    LG_main_number_struts = 2
    LG_main_wheels_per_strut = 2

[Structures]
    stress_factor = 1.0 # convenient factor to multiply all stress below

    # Allowable stresses at sizing cases:
    caps_material = "TASOPT-Al"
    caps_max_avg_stress = 1.1
    caps_safety_factor = 1.5
    # the sigma_max works out to be roughly 30e3 lbf/in2
    
    webs_material = "TASOPT-Al"
    webs_max_avg_stress = 1.1
    webs_safety_factor = 1.5
    # the sigma_max works out to be roughly 30e3 lbf/in2
    
    ## Fuselage pressurization skin stress and bending skin+stringer stress
    strut_material = "TASOPT-Al"
    strut_max_avg_stress = 1.1
    strut_safety_factor = 1.5
    # The strut_* keys above are the strut caps. The strut_web_* keys are the strut webs; they are optional and each defaults to the strut_* value
    strut_web_material = "TASOPT-Al"
    strut_web_max_avg_stress = 1.1
    strut_web_safety_factor = 1.5

    skin_material = "TASOPT-Al"
    skin_max_avg_stress = 1.1
    skin_safety_factor = 3.0
    # the sigma_max works out to be roughly 15e3 lbf/in2
    
    bending_material = "TASOPT-Al"
    bending_max_avg_stress = 1.1
    bending_safety_factor = 1.5
    # the sigma_max works out to be roughly 30e3 lbf/in2

    cone_material = "TASOPT-Al"
    cone_max_avg_stress = 1.1
    cone_safety_factor = 2.0

